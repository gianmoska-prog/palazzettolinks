*{box-sizing:border-box}html{background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%;font-family:Inter,Arial,sans-serif}body{margin:0;background:radial-gradient(ellipse at 100% 0%,#e8d9bd66,transparent 55%),var(--paper);min-height:100vh;min-height:100svh}a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:rgba(179,151,105,.14)}a:focus-visible{outline:2px solid #8f7041;outline-offset:5px}svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}.symbols{position:absolute;width:0;height:0;overflow:hidden}

.identity{text-align:center;animation:arrive .8s both}.eyebrow{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin:6px 0 16px}.logo{display:block;width:220px;max-width:75%;height:auto;margin:0 auto;mix-blend-mode:multiply}.place{display:flex;align-items:center;justify-content:center;gap:13px;color:var(--muted);font-size:10px;letter-spacing:.19em;text-transform:uppercase;margin:16px 0 25px}.place:before,.place:after{content:'';width:28px;height:1px;background:var(--line)}h1{font-family:Cormorant,Georgia,serif;font-weight:400;font-size:31px;line-height:1.1;margin:0 0 8px}.intro{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 22px}
.links{animation:arrive .8s .1s both}.social-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{display:flex;align-items:center;gap:12px;min-height:78px;padding:15px 13px;background:rgba(255,255,255,.23);border:1px solid var(--line);transition:background .25s,border-color .25s,transform .25s}.tile svg{color:#927647;width:22px;height:22px}.label{display:block;font-size:12px;font-weight:500;letter-spacing:.02em}.detail{display:block;font-size:10px;color:var(--muted);margin-top:6px;line-height:1.45}.email{display:flex;gap:14px;align-items:center;padding:20px 4px;border-bottom:1px solid var(--line);margin-top:2px;min-height:77px}.email svg{color:#927647}.email .detail{font-size:11px;overflow-wrap:anywhere}.email .arrow{margin-left:auto;width:15px;height:15px;color:var(--muted)}
.website{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#342c25;color:var(--paper);padding:20px;margin-top:20px;min-height:62px;transition:background .25s}.website .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase}.website svg{width:19px;height:19px;color:#d9c39b}.address{display:flex;gap:13px;align-items:center;padding:21px 4px 18px}.address svg{color:#927647}.address .label{font-family:Cormorant,Georgia,serif;font-size:21px;font-weight:500}.address .detail{margin-top:3px;font-size:11px}.address .arrow{width:15px;height:15px;margin-left:auto}footer{text-align:center;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:9px;letter-spacing:.17em;text-transform:uppercase;animation:arrive .8s .2s both}
/* Suppress native mobile tap flashes without removing keyboard focus feedback. */
a, a *{-webkit-tap-highlight-color:transparent}
main{background:var(--paper);padding-top:calc(36px + env(safe-area-inset-top));padding-bottom:calc(30px + env(safe-area-inset-bottom))}
main:before{display:none}
.logo{width:228px}
.place{margin:18px 0 32px;letter-spacing:.16em}
h1{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.tile{border-radius:8px;min-height:76px;background:rgba(255,255,255,.35);border-color:rgba(139,112,72,.20)}
.tile .label{font-size:13px;letter-spacing:0}
.tile--website{grid-column:1/-1;min-height:68px;background:#f4ead8;border-color:#c8b18c;justify-content:center;gap:14px}
.tile--website .label{font-weight:600;letter-spacing:.03em}
.tile--website svg{width:23px;height:23px}
.tile .detail{font-size:10px}
.identity{mix-blend-mode:multiply}
@media(hover:hover){.tile:hover{background:#f0e5d1;border-color:#b39769;transform:translateY(-2px)}.website:hover{background:#514233}.email:hover .label,.address:hover .label{color:#927647}}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
@media(min-width:600px){body{padding:32px 16px;background:#eee5d7}main{background:var(--paper);border:1px solid var(--line);padding-left:36px;padding-right:36px;box-shadow:0 18px 70px #3027200d}}
@media(max-width:350px){main{padding-left:18px;padding-right:18px}.tile{gap:9px;padding:13px 9px}.detail{font-size:9px}.logo{width:200px}}
</style>
